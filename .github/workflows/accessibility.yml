name: Accessibility Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM

jobs:
  accessibility:
    name: Axe-core Accessibility Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          
      - name: Start preview server
        run: |
          npm run dev &
          sleep 10
          
      - name: Run axe-core accessibility audit
        run: |
          npm exec playwright install chromium
          node scripts/a11y-audit.js
        env:
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          
      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: a11y-results.json
          
      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('a11y-results.json', 'utf-8'));
            
            let comment = '## 🔍 Accessibility Audit Results\n\n';
            
            if (results.violations && results.violations.length > 0) {
              comment += `❌ **${results.violations.length} accessibility violations found**\n\n`;
              
              for (const violation of results.violations.slice(0, 10)) {
                comment += `### ${violation.id} (${violation.impact} impact)\n`;
                comment += `${violation.description}\n\n`;
                comment += `**Help:** ${violation.helpUrl}\n\n`;
                comment += `**Affected elements:** ${violation.nodes.length}\n\n`;
              }
              
              if (results.violations.length > 10) {
                comment += `\n... and ${results.violations.length - 10} more violations.\n`;
              }
            } else {
              comment += '✅ **No accessibility violations found!**\n';
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
